<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 320" width="1000" height="320" role="img" aria-label="Bifrost: a fiction recommender that measures when book text beats reader behaviour">
  <style>
    .shimmer { animation: shimmer 5s ease-in-out infinite; }
    .flicker { animation: flicker 3.4s ease-in-out infinite; }
    .flicker2 { animation: flicker 4.1s ease-in-out infinite 1.1s; }
    .mote1 { animation: mote 5s ease-in-out infinite; }
    .mote2 { animation: mote 6.5s ease-in-out infinite 1.3s; }
    .mote3 { animation: mote 7.5s ease-in-out infinite 2.6s; }
    @keyframes shimmer { 0%,100% { opacity: .6; } 50% { opacity: 1; } }
    @keyframes flicker { 0%,100% { opacity: .55; } 30% { opacity: .85; } 55% { opacity: .6; } 80% { opacity: .95; } }
    @keyframes mote { 0%,100% { opacity: .1; transform: translateY(0); } 50% { opacity: .8; transform: translateY(-6px); } }
    /* Respect the system "reduce motion" setting. */
    @media (prefers-reduced-motion: reduce) {
      .shimmer, .flicker, .flicker2, .mote1, .mote2, .mote3 { animation: none; }
    }
  </style>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#17110d"/>
      <stop offset="0.6" stop-color="#1f1610"/>
      <stop offset="1" stop-color="#0e0a08"/>
    </linearGradient>
    <radialGradient id="vignette" cx="0.5" cy="0.45" r="0.75">
      <stop offset="0.55" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.7"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f1deaa"/>
      <stop offset="1" stop-color="#b98a3e"/>
    </linearGradient>
    <linearGradient id="arc" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#c9a24b" stop-opacity="0"/>
      <stop offset="0.25" stop-color="#c9a24b"/>
      <stop offset="0.75" stop-color="#c9a24b"/>
      <stop offset="1" stop-color="#c9a24b" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="candle" cx="0.5" cy="0.6" r="0.6">
      <stop offset="0" stop-color="#ffcf7a" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#ffcf7a" stop-opacity="0"/>
    </radialGradient>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" seed="4"/>
      <feColorMatrix values="0 0 0 0 0.9  0 0 0 0 0.8  0 0 0 0 0.6  0 0 0 0.9 0"/>
    </filter>
    <filter id="glow" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
  </defs>

  <rect width="1000" height="320" fill="url(#bg)"/>

  <!-- Two tall arched library windows with candlelight behind them -->
  <g>
    <path d="M70 280 V120 a50 50 0 0 1 100 0 V280 Z" fill="#120d0a" stroke="#6b4f2a" stroke-width="2"/>
    <path d="M830 280 V120 a50 50 0 0 1 100 0 V280 Z" fill="#120d0a" stroke="#6b4f2a" stroke-width="2"/>
    <ellipse class="flicker" cx="120" cy="215" rx="42" ry="70" fill="url(#candle)"/>
    <ellipse class="flicker2" cx="880" cy="215" rx="42" ry="70" fill="url(#candle)"/>
    <g stroke="#6b4f2a" stroke-width="1.6" opacity="0.8">
      <path d="M120 70 V280 M70 190 H170"/><path d="M880 70 V280 M830 190 H930"/>
    </g>
  </g>

  <!-- The bridge: one thin arc of gold light over the title -->
  <path d="M 190 262 Q 500 -34 810 262" fill="none" stroke="#c9a24b" stroke-width="10" opacity="0.35" class="shimmer" filter="url(#glow)"/>
  <path d="M 190 262 Q 500 -34 810 262" fill="none" stroke="url(#arc)" stroke-width="2.6" stroke-linecap="round"/>

  <!-- Drifting dust motes in the candlelight -->
  <g fill="#f1deaa">
    <circle class="mote1" cx="260" cy="120" r="1.6"/><circle class="mote2" cx="330" cy="70" r="1.3"/>
    <circle class="mote3" cx="430" cy="52" r="1.5"/><circle class="mote1" cx="560" cy="60" r="1.3"/>
    <circle class="mote2" cx="690" cy="80" r="1.6"/><circle class="mote3" cx="760" cy="130" r="1.3"/>
  </g>

  <!-- Parchment label -->
  <g transform="translate(36 26)">
    <rect x="3" y="3" width="318" height="28" fill="#000" opacity="0.5"/>
    <rect width="318" height="28" fill="#e9dcc0" stroke="#7a5a2a" stroke-width="1.5"/>
    <text x="159" y="18.5" text-anchor="middle" textLength="290" lengthAdjust="spacing" font-family="Georgia, 'Palatino Linotype', 'Book Antiqua', 'Times New Roman', serif" font-size="12.5" font-weight="bold" fill="#3a2a1a">A STORY OF BOOKS &amp; BEHAVIOUR</text>
  </g>

  <!-- Title: burgundy shadow, then gold lettering -->
  <g font-family="Georgia, 'Palatino Linotype', 'Book Antiqua', 'Times New Roman', serif" font-weight="bold" font-size="96" text-anchor="middle">
    <text x="504" y="196" textLength="520" lengthAdjust="spacing" fill="#5a1a22">BIFROST</text>
    <text x="500" y="192" textLength="520" lengthAdjust="spacing" fill="url(#gold)" stroke="#0e0a08" stroke-width="2" paint-order="stroke">BIFROST</text>
  </g>

  <!-- Ornamental rule and subtitle -->
  <g stroke="#b8913f" stroke-width="1.2" opacity="0.8">
    <path d="M300 222 H470"/><path d="M530 222 H700"/>
  </g>
  <path d="M500 215 L507 222 L500 229 L493 222 Z" fill="#b8913f"/>
  <text x="500" y="252" text-anchor="middle" textLength="700" lengthAdjust="spacing" font-family="Georgia, 'Palatino Linotype', 'Book Antiqua', 'Times New Roman', serif" font-style="italic" font-size="19" fill="#d9c9a3">A fiction recommender that measures when book text beats reader behaviour</text>

